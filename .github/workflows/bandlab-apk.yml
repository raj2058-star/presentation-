name: Build Bandlab React APK

on:
  push:
    paths:
      - "bandlab/**"
      - ".github/workflows/bandlab-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build web app (make + webpack)
        working-directory: bandlab
        run: |
          make
          node node_modules/webpack/bin/webpack.js -p
          ls -la dist

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: bandlab/android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp bandlab/android/app/build/outputs/apk/debug/app-debug.apk BandlabReactTest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BandlabReactTest-apk
          path: BandlabReactTest.apk

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bandlab-build-${{ github.run_number }}
          name: Bandlab React Test APK (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: BandlabReactTest.apk
          body: |
            Android build of the bandlab React test app (Posts and Samples pages).
            Download BandlabReactTest.apk on your phone, open it, and allow installing from this source when asked.
            The app needs an internet connection to load posts and audio samples.
